# Services for the integration tests. Tests for a service that isn't running are skipped.
#   docker compose up -d            # everything
#   docker compose up -d postgres   # one service
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports: ["3306:3306"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  valkey:
    image: valkey/valkey:8
    ports: ["6380:6379"]

  memcached:
    image: memcached:1.6
    ports: ["11211:11211"]
